<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>For Kaviya</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #fff5f7 0%, #ffe9ef 45%, #ffe0e9 100%);
    text-align: center;
  }
  .card {
    max-width: 420px;
  }
  .heart {
    font-size: 40px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(24px, 6vw, 32px);
    margin: 0 0 12px;
    color: #3a2a2f;
    letter-spacing: 0.01em;
  }
  p {
    font-size: clamp(15px, 4vw, 17px);
    color: #6b5760;
    margin: 0;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">💌</div>
    <h1>For Kaviya</h1>
    <p>Something is on its way.</p>
  </div>
</body>
</html>
